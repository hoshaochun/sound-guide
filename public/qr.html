<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>聲音 QR code</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    @media print {
      body { background: white; color: black; }
      .card, .qr-card { background: white; border: 1px solid #ccc; }
      .no-print { display: none; }
    }
    .qr-card {
      background: #181c23;
      border: 1px solid #262c36;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      max-width: 600px;
      margin: 0 auto;
    }
    .qr-card img { width: 100%; height: auto; background: white; border-radius: 8px; padding: 12px; }
    .qr-card .url { margin-top: 12px; font-size: 14px; color: #b9c2cf; word-break: break-all; }
  </style>
</head>
<body>
  <main class="container">
    <h1 class="no-print">聲音 QR code</h1>
    <p class="muted no-print">掃描以加入聲音導覽</p>
    <div class="qr-card">
      <img alt="QR code to join the tour" src="/api/qr" />
      <div class="url" id="url"></div>
    </div>
  </main>
  <script>
    document.getElementById('url').textContent = location.origin + '/listen';
  </script>
</body>
</html>
